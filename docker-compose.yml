services:
  web:
    image: wakamation:local
    build:
      context: .
      args:
        NEXT_PUBLIC_GAME_SERVER_URL: wss://${GAME_HOST:?Set GAME_HOST in .env}
    command: ["node", "node_modules/next/dist/bin/next", "start", "client", "--hostname", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped

  game:
    image: wakamation:local
    command: ["node", "server/dist/index.js"]
    environment:
      PORT: "2567"
      ALLOWED_ORIGINS: https://${APP_HOST:?Set APP_HOST in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
      GAME_HOST: ${GAME_HOST:?Set GAME_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      game:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
